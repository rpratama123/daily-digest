[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-digest"
version = "0.1.0"
description = "A resilient daily household and provider digest for Unraid"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings[yaml]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build]
exclude = [
  "/.env",
  "/.opencode",
  "/config.yaml",
  "/docs",
  "/samples",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
